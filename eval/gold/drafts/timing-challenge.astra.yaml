label_conventions:
  method: Manual source reading; no prototype code or output used as label input.
  zero_offset: Zero denotes no additional counted delay for an on/upon/before bound, not a quoted numeric zero.
  signed_offset: Negative offsets are counted before the event; positive offsets are counted after it.
  null_relation: No single temporal comparator is supported; a contingent trigger can create a duty or right without
    an explicit due-on requirement.
  null_anchor: No eligible dated anchor is bound; a mentioned but non-governing date is not attached.
  anchor_segments: segment_id is the first segment; end_segment_id permits the adjacent BLI value segment; character
    offsets are authoritative.
  original_quote_scope: Labels apply to the full supplied obligation span, including exceptions and qualifications.
