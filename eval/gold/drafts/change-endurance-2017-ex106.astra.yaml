draft_notes:
- Blind source-only draft for adjudication; no model check output was inspected.
- Gate answers cover the whole amendment, including changes outside the four representable finding kinds; lexical
  mentions alone do not make a gate positive.
- Each rent schedule row is a separate changed amount-and-period target; each grouped replacement or renaming is
  one clause target, not one finding per cross-reference or suite.
- Caption old spans identify replaced clause-level targets without asserting unseen diagram contents or making an
  obligation-edge claim.
- Supersedes and potential_conflict values are null; price_change amounts are added or restated amounts with no
  old rate or computed delta.
- 'The chain is incomplete: 2A and the OS Rider are named but absent; no prior 2A rent, option content, or intervening
  notice-address history is inferred.'
- The p0011 extension and p0012 surrender-date substitution are one supersedes target, represented at p0012; the
  separate shifted_date kind at p0011 records the supported numeric date pair.
- Deletion of an already exercised extension option is labeled dates, not termination, under the frozen question
  definitions; unknown 2A terms do not justify a positive termination label.
