      other party that (i) if it is a partnership, the undersigned are all of its general partners, (ii) it has
      been validly formed or incorporated, (iii) it is duly qualified to do business in the state in which the Building
      is located, and (iv) this Amendment is being executed on its behalf and for its benefit.
