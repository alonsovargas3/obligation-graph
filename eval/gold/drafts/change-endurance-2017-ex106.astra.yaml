      by virtue of having dealt with Tenant with regard to the transaction contemplated by this Amendment. The provisions
      of this paragraph shall survive the expiration of the Term of the Lease or any renewal or extension thereof.
  reason: Contingent broker claims and costs have no numeric money token and cannot be represented as a price_change
    amount.
