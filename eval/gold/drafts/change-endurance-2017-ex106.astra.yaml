- change: Unseen extension-option and surrender conditions in 2A
  segment_ids:
  - p0011
  - p0012
  - p0013
  evidence:
  - segment_id: p0011
    span_text: A.    Currently, the portion of the Premises located in Suite 409 of the Building is scheduled to
      be surrendered to Landlord on June 30, 2018, subject to Tenant’s exercise of the Suite 409 Extension Option
      pursuant to Section 2.C of 2A. Landlord and Tenant acknowledge and agree that Tenant has timely exercised
      the Suite 409 Extension Option. Accordingly, notwithstanding anything in the Lease to the contrary, effective
      as of and from and after the 3A Effective Date, the Term of the Lease, as it relates to Suite 409, shall be
      extended for a period of twenty-four (24) calendar months (the “3A Suite 409 Extended Term”), commencing July
      1, 2018 and expiring June 30, 2020 (the “3A Suite 409 Amended Surrender Date”).
  - segment_id: p0012
    span_text: B.    Notwithstanding anything in the Lease to the contrary, Tenant agrees to surrender Suite 409
      to Landlord no later than the 3A Suite 409 Amended Surrender Date, and acknowledges and agrees that the terms
      and conditions stated in Sections 1.A and 1.B of 2A shall apply in connection with such surrender, the same
      as if the 3A Suite 409 Amended Surrender Date was the Suite 409 Surrender Date (as defined in Section 1.A
      of 2A). For the avoidance of doubt, all references in the Lease to the Suite 409 Surrender Date shall be deemed
      to refer to the 3A Suite 409 Amended Surrender Date.
  - segment_id: p0013
    span_text: C.    Effective as of the 3A Effective Date, Section 2.C of 2A is hereby deleted in its entirety
      and of no further force or effect.
  reason: The deletion and date replacement are represented, but the text of Sections 1.A, 1.B and 2.C of 2A is
    absent; no additional option, termination, penalty, or surrender condition can be reconstructed.
