unrepresentable:
- change: New expansion date and installation completion deadline
  segment_ids:
  - p0014
  - p0027
  - p0035
  evidence:
  - segment_id: p0014
    span_text: A. Additional Premises. Effective as of June 1, 2012 (the “1A Expansion Date”, Original Suite 418A
      is hereby expanded to include approximately 1,225 square feet of caged area approximately as shown on Exhibit
      “A-1”, attached hereto (the “Suite 418A Expansion Space”).
  - segment_id: p0027
    span_text: As of June 1, 2012 (the “1A Expansion Date”), Suite 418A shall be deemed to have been expanded to
      2,425 square feet of area in the Building, caged as set froth on Exhibit “A-1-A”.
  - segment_id: p0035
    span_text: (i) Subject to Landlord’s completion of Landlord’s Suite 418A Installations (as defined on Exhibit
      “E-1”, attached hereto), Tenant hereby accepts the Suite 418A Expansion Space in its “AS IS, WHERE IS” condition
      on the 1A Expansion Date, without the benefit of a warranty of suitability or fitness for Tenant’s intended
      use. Landlord hereby agrees to cause the completion of Landlord’s Suite 418A Installations (as defined on
      Exhibit “E-1”, attached hereto) on or before the 1A Expansion Date. The foregoing notwithstanding, Landlord
      and Tenant acknowledge and agree that Landlord’s completion of Landlord’s Suite 418A Installations is not
      a condition precedent to any obligation of Tenant to pay Rent, nor is such completion a condition precedent
      to the occurrence of the 1A Expansion Date. Additionally, provided that Landlord is working diligently using
      commercially reasonable efforts after the 1A Expansion Date to complete the installation of Landlord’s Suite
      418A Installations, Landlord shall not be in default of its obligation to complete Landlord’s Suite 418A Installations.
      For the avoidance of doubt, Landlord’s Suite 418A Installations are hereby deemed to be included in the definition
      of “Landlord’s Installations” for the purposes of Section 8.3.1 and 9.1.1 of the Lease.
  reason: These add an expansion milestone and a defined-date completion obligation, not a shift between two quoted
    ISO dates of the same role; no shifted_date finding is supportable.
