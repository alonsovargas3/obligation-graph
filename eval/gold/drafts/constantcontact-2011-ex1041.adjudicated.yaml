  span_text: All Base Rent shall be paid to Landlord in monthly installments in advance on the first day of each and every calendar month throughout the Term of this Lease; provided, however, that (a) the installment of Base Rent for the first (1st) full calendar month of the Term shall be payable upon Tenant’s execution of this Lease; and (b) if the Term of this Lease does not commence on the first day of a calendar month, the Base Rent for the Partial Month shall (i) be calculated on a per diem basis determined by dividing the Base Rent above by the total number of calendar days in such Partial Month and multiplying such amount by the number of days remaining in such Partial Month from and after (and including) the Commencement Date, and (ii) be paid by Tenant to Landlord on the Commencement Date.
